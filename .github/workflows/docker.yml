name: Build and push Docker image

on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Update image tag in homelab-talos
        env:
          GH_TOKEN: ${{ secrets.HOMELAB_TOKEN }}
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          IMAGE="ghcr.io/ryjogo/honk.dk:sha-${SHORT_SHA}"

          git clone https://x-access-token:${GH_TOKEN}@github.com/ryjogo/homelab-talos.git
          cd homelab-talos

          sed -i "s|image: ghcr.io/ryjogo/honk.dk:.*|image: ${IMAGE}|" \
            argocd/apps/honk-website/deployment.yaml

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add argocd/apps/honk-website/deployment.yaml
          git diff --staged --quiet || git commit -m "chore: update honk-website to sha-${SHORT_SHA}"
          git push
